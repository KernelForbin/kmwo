name: Deploy kmwo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no repo code, gets
# the Pages and token permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit, with the release tag alongside (same pins
# as the pfml repo), so a moved tag can't change what runs with a Pages token.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site is plain HTML, CSS and JS, so there is no build step. This
      # guard fails the deploy if a secret or data file ever slips in.
      - name: Refuse to publish secrets
        run: |
          found="$(find site \( -name '*.csv' -o -name '.env*' -o -name '*.pem' \) -print)"
          if [ -n "$found" ] || grep -rIlE 'sb_secret_[A-Za-z0-9_-]{10,}' site; then
            echo "Secrets or data files found in site/. They must not be public."
            echo "$found"
            exit 1
          fi

      # Pages tells browsers to cache files for 10 minutes, so right after a
      # deploy a page could run with an old cached script. Every local .js
      # and .css reference gets ?v=<commit>, in this checkout only.
      - name: Stamp scripts and styles with this commit
        run: |
          v="${GITHUB_SHA::12}"
          sed -i -E "s/(src|href)=\"([A-Za-z0-9_-]+\.(js|css))\"/\1=\"\2?v=$v\"/g" site/*.html
          grep -c "?v=$v" site/*.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        timeout-minutes: 10
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
