<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Progress · kmwo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="kmwo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="theme.js"></script>
<script src="splash.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Shared gradients for the charts -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b6bff"/></linearGradient>
    <linearGradient id="bargrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6bff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
    <linearGradient id="areagrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff" stop-opacity=".35"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient>
  </defs>
</svg>

<main id="app" hidden>
  <div class="top">
    <div>
      <p class="eyebrow" id="weeklabel">Nov 11 &ndash; Jan 5</p>
      <h1>Progress</h1>
    </div>
    <div class="account" id="account"></div>
  </div>

  <p class="error" id="err" hidden></p>

  <div class="card ringcard" id="ringcard"></div>
  <div class="tiles" id="tiles"></div>

  <h2>Sessions per week</h2>
  <div class="card chart" id="weekly"></div>

  <h2>Top set weight</h2>
  <div id="lifts"></div>

  <h2>Other workouts</h2>
  <div class="card" id="others"></div>

  <h2>Steps</h2>
  <div class="card chart" id="steps"></div>
  <div class="card chart" id="stepsmonthly"></div>

  <h2>Body weight</h2>
  <div id="bodyweight"></div>

  <h2>Daily checklist</h2>
  <div class="card chart" id="habits"></div>
  <div class="card chart" id="water"></div>

  <nav class="tabs">
    <a href="/"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="/plan"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Plan</a>
    <a href="/progress" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Progress</a>
  </nav>
</main>

<main id="gate" class="center">
  <img class="brand" src="icon.svg" alt="">
  <h1>kmwo</h1>
  <p class="muted" id="gate-msg">Loading&hellip;</p>
  <button type="button" class="primary" id="signin" hidden>Sign in with Google</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
        integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="menu.js"></script>
<script src="plan.js"></script>
<script src="progress.js"></script>
</body>
</html>
