<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>kmwo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="kmwo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" hidden>
  <header>
    <h1>Nov 16 to Jan 10</h1>
    <button type="button" id="signout">Sign out</button>
  </header>
  <p class="muted small" id="who"></p>

  <a class="next" id="next" href="/">
    <span class="label">Next up</span>
    <strong id="next-title"></strong>
    <span class="muted" id="next-desc"></span>
  </a>

  <p class="error" id="err" hidden></p>

  <h2>Calendar</h2>
  <div class="grid head" id="dayhead"></div>
  <div id="weeks"></div>
  <p class="muted small legend">
    <span class="key lift">L</span> Lift &nbsp;
    <span class="key ride">R</span> Ride &nbsp;
    <span class="key done">&#10003;</span> Done &nbsp;
    Tap any day to log it.
  </p>

  <nav class="tabs">
    <a href="/" class="on">Calendar</a>
    <a href="/plan">Plan</a>
    <a href="/progress">Progress</a>
  </nav>
</main>

<main id="gate" class="center">
  <h1>kmwo</h1>
  <p class="muted" id="gate-msg">Loading&hellip;</p>
  <button type="button" class="primary" id="signin" hidden>Sign in with Google</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
        integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
