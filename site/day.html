<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Log · kmwo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="kmwo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="theme.js"></script>
<script src="splash.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" hidden>
  <div class="navrow">
    <a href="/" class="back">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Calendar
    </a>
    <div class="account" id="account"></div>
  </div>
  <p class="eyebrow" id="weeklabel"></p>
  <h1 id="title"></h1>
  <p class="muted" id="planned"></p>

  <div class="seg four" role="radiogroup" aria-label="Plan session">
    <button type="button" data-kind="lift" role="radio">Lift</button>
    <button type="button" data-kind="ride" role="radio">Ride</button>
    <button type="button" data-kind="skip" role="radio">Skipped</button>
    <button type="button" data-kind="none" role="radio">None</button>
  </div>

  <div id="plansection">
  <p class="muted small skip-desc" id="skip-desc" hidden></p>
  <div class="toggle-card" id="shortcard">
    <label class="check" style="margin:0">
      <input type="checkbox" id="short">
      <span><strong>Short on time</strong> <span class="muted">· 10-minute home version</span></span>
    </label>
    <p class="muted small" id="short-desc" hidden style="margin:8px 0 0 30px">2 rounds: 10 goblet squats, 10 push-ups, 10 rows per side. It counts.</p>
  </div>

  <section id="lift"></section>

  <section id="ride" hidden>
    <div class="card">
      <label class="field" style="margin-top:0"><span>Minutes</span>
        <div class="stepper">
          <button type="button" id="ride-dec" aria-label="Five minutes less">&minus;</button>
          <input type="number" id="ride-min" inputmode="numeric" min="1" max="300">
          <button type="button" id="ride-inc" aria-label="Five minutes more">+</button>
        </div></label>
      <label class="field"><span>Class type</span>
        <select id="ride-type"></select></label>
      <p class="muted small" id="ride-hint"></p>
      <p class="muted small">Take the post-ride stretch.</p>
    </div>
  </section>

  <label class="field"><span>Note</span>
    <textarea id="note" rows="2" placeholder="How did it feel?"></textarea></label>
  </div>

  <h2>Also this day</h2>
  <div id="extras"></div>
  <div class="addrow" id="addrow">
    <button type="button" class="chip add" data-add="workout">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Workout</button>
    <button type="button" class="chip add" data-add="steps">
      <svg class="i" viewBox="0 0 24 24"><path d="M8 16c-2 0-3-2-3-5s1-6 3-6 3 3 3 5-1 6-3 6zM16 20c-2 0-3-3-3-5s1-5 3-5 3 2 3 5-1 5-3 5z"/></svg>Steps</button>
    <button type="button" class="chip add" data-add="weight">
      <svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0M12 10l1.5-2"/></svg>Body weight</button>
  </div>

  <p class="error" id="err" hidden></p>
  <button type="button" class="danger" id="clear" hidden>Remove everything for this day</button>

  <div class="savebar"><div>
    <button type="button" class="primary" id="save">Save and mark done</button>
  </div></div>

  <!-- Bottom sheet: pick a workout, or type a new one (saved for next time) -->
  <div class="sheet-back" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <h3 id="sheet-title">Add a workout</h3>
      <form class="sheet-new" id="sheet-form">
        <input id="sheet-input" type="text" maxlength="40" placeholder="Search or add new&hellip;" autocomplete="off" enterkeyhint="done">
        <button type="submit" class="primary" id="sheet-addnew" hidden>Add</button>
      </form>
      <div class="chips" id="sheet-chips"></div>
      <p class="muted small" id="sheet-hint">New names are saved to this list for next time.</p>
    </div>
  </div>
</main>

<main id="gate" class="center">
  <img class="brand" src="icon.svg" alt="">
  <h1>kmwo</h1>
  <p class="muted" id="gate-msg">Loading&hellip;</p>
  <button type="button" class="primary" id="signin" hidden>Sign in with Google</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
        integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="menu.js"></script>
<script src="plan.js"></script>
<script src="day.js"></script>
</body>
</html>
