<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Log · kmwo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="kmwo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" hidden>
  <header>
    <a href="/" class="back" aria-label="Back to calendar">&larr; Calendar</a>
    <span class="muted small" id="weeklabel"></span>
  </header>
  <h1 id="title"></h1>
  <p class="muted" id="planned"></p>

  <div class="seg" role="radiogroup" aria-label="Session type">
    <button type="button" data-kind="lift" role="radio">Lift</button>
    <button type="button" data-kind="ride" role="radio">Ride</button>
  </div>

  <label class="check">
    <input type="checkbox" id="short">
    <span>Short on time: 10-minute home version</span>
  </label>
  <p class="muted small" id="short-desc" hidden>2 rounds: 10 goblet squats, 10 push-ups, 10 rows per side. It counts.</p>

  <section id="lift"></section>

  <section id="ride" hidden>
    <div class="card">
      <label class="field"><span>Minutes</span>
        <input type="number" id="ride-min" inputmode="numeric" min="1" max="300"></label>
      <label class="field"><span>Class type</span>
        <select id="ride-type"></select></label>
      <p class="muted small" id="ride-hint"></p>
      <p class="muted small">Take the post-ride stretch.</p>
    </div>
  </section>

  <label class="field"><span>Note</span>
    <textarea id="note" rows="2" placeholder="Optional"></textarea></label>

  <p class="error" id="err" hidden></p>

  <div class="actions">
    <button type="button" class="primary" id="save">Save and mark done</button>
    <button type="button" class="danger" id="clear" hidden>Remove this log</button>
  </div>
</main>

<main id="gate" class="center">
  <h1>kmwo</h1>
  <p class="muted" id="gate-msg">Loading&hellip;</p>
  <button type="button" class="primary" id="signin" hidden>Sign in with Google</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
        integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="plan.js"></script>
<script src="day.js"></script>
</body>
</html>
